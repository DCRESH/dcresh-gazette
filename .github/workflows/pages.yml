name: Publish newspaper

on:
  push:
    branches: [main]       # editing config.json publishes a new edition right away
  schedule:
    # A new edition every hour (EDITION_HOURS). GitHub's scheduler drops many
    # scheduled runs and delays others, so wake every 15 minutes and publish
    # only when an edition time has passed since the paper was last printed
    # (see scripts/edition-due.js): late or dropped wake-ups can't cause a
    # missed or doubled edition. A wake-up that finds the paper current stops
    # after a few seconds.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:       # "Run workflow" button for an immediate edition

permissions:
  contents: read
  pages: write
  id-token: write

env:
  EDITION_HOURS: 'hourly'   # or local hours, e.g. '6 18' for 6 AM and 6 PM
  # The paper's time zone. Set a repository variable named TZ to change it.
  TZ: ${{ vars.TZ || 'America/New_York' }}

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
      - id: check
        name: Is an edition due?
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            node scripts/edition-due.js >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Only runs that publish take part in these queues: a newer edition cancels
  # an older one still building or deploying, including a deploy stuck
  # waiting on GitHub Pages (which once blocked every later edition for
  # hours). Wake-ups that find the paper current never get this far, so they
  # can't cancel an edition you just triggered.
  build:
    needs: when
    if: needs.when.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: node build.js
        env:
          EDIT_URL: ''   # hide the "Edit feeds" link in the footer
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
