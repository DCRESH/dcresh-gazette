name: Publish newspaper

on:
  push:
    branches: [main]       # editing config.json publishes a new edition right away
  schedule:
    # Two editions a day, at EDITION_HOURS (6 AM and 5 PM in the paper's time
    # zone). GitHub's scheduler runs only some scheduled wake-ups, often late,
    # so wake every 10 minutes in the hours after each edition time and hourly
    # otherwise; the due-check (scripts/edition-due.js) prints each edition
    # once, on the first wake-up that gets through. UTC hours cover both
    # daylight saving (6 AM = 10:00, 5 PM = 21:00) and standard time
    # (11:00 and 22:00).
    - cron: '*/10 10-12,21-23 * * *'
    - cron: '37 * * * *'
  # "Run workflow" button for an immediate edition. An outside timer (see the
  # README) can also call this hourly with {"scheduled": "true"}: GitHub runs
  # those right away, unlike its own schedule, and they use the same due-check.
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Only publish if an edition is due (for automated hourly triggers)'
        required: false
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  EDITION_HOURS: '6 17'   # local hours: 6 AM and 5 PM ('hourly' for every hour)
  # The paper's time zone. Set a repository variable named TZ to change it.
  TZ: ${{ vars.TZ || 'America/New_York' }}

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule' || inputs.scheduled == 'true'
      - id: check
        name: Is an edition due?
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.scheduled }}" = true ]; then
            node scripts/edition-due.js >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Only runs that publish take part in these queues: a newer edition cancels
  # an older one still building or deploying, including a deploy stuck
  # waiting on GitHub Pages (which once blocked every later edition for
  # hours). Wake-ups that find the paper current never get this far, so they
  # can't cancel an edition you just triggered.
  build:
    needs: when
    if: needs.when.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: node build.js
        env:
          EDIT_URL: ''   # hide the "Edit feeds" link in the footer
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
