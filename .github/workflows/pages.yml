name: Publish newspaper

on:
  push:
    branches: [main]       # editing config.json publishes a new edition right away
  schedule:
    # A new edition every hour (EDITION_HOURS). GitHub's scheduler often runs
    # late or skips runs, so wake twice an hour and publish only when an
    # edition time has passed since the paper was last printed (see
    # scripts/edition-due.js): a late or skipped wake-up can't cause a missed
    # or doubled edition.
    - cron: '17,47 * * * *'
  workflow_dispatch:       # "Run workflow" button for an immediate edition

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EDITION_HOURS: 'hourly'   # or local hours, e.g. '6 18' for 6 AM and 6 PM
  # The paper's time zone. Set a repository variable named TZ to change it.
  TZ: ${{ vars.TZ || 'America/New_York' }}

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
      - id: check
        name: Is an edition due?
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            node scripts/edition-due.js >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: when
    if: needs.when.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: node build.js
        env:
          EDIT_URL: ''   # hide the "Edit feeds" link in the footer
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
